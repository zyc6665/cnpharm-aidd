# =============================================================================
# pre-commit 门禁（开发者本机提交前自动检查）
# =============================================================================
# 安装（一次性）：
#   pip install pre-commit
#   pre-commit install
# 全量手动运行：
#   pre-commit run --all-files
# 只跑某个钩子：
#   pre-commit run ruff --files backend/app/xxx.py
#
# —— 离线 / 内网可用性说明（重要）——
#   pre-commit 首次运行时，会从 GitHub 拉取下列 hook 仓库并缓存到 ~/.cache/pre-commit。
#   纯离线环境有三种落地方式：
#     1) 预热缓存：在有网机器上执行一次 `pre-commit install-hooks`（或 run --all-files），
#        再把整个 ~/.cache/pre-commit 目录整包拷到离线机器；
#     2) 内网镜像：把各 repo 的 https://github.com/... 换成企业内网 Git 镜像地址，
#        并把 rev 固定为镜像里存在的 tag；
#     3) 临时跳过：`SKIP=gitleaks git commit`（只跳过单个钩子）。禁止 `--no-verify` 全跳过。
#   说明：本文件是「开发者本机工具」配置，不进入交付运行时，也不在
#   scripts/check_offline_compliance.py 的扫描范围内（该脚本只扫 backend/app 等运行目录）。
#
# —— 与 CI 的关系 ——
#   本配置是本地第一道防线，用于「增量检查本次提交涉及的文件」，**不会全量重排历史代码**。
#   若某个历史文件被顺手修改，ruff-format 只会就地整理该文件；请把这类纯格式化改动
#   与业务改动拆成不同提交/PR，避免 review 被噪声淹没（见 CONTRIBUTING「代码归属」）。
# =============================================================================

# —— 前端检查说明 ——
#   frontend/package.json 目前没有 lint / prettier 脚本（devDependencies 里虽有 eslint、prettier，
#   但未配置 npm 脚本）。若在此 PR 引入 lint-staged + husky 统一前端格式，会改动
#   package-lock.json 并触发重新安装，故本次不新增任何 npm 包；前端本地如需自检可临时跑：
#     cd frontend && npx eslint "src/**/*.{ts,vue}" && npx prettier --check "src/**/*.{ts,vue}"
#   待团队确认前端 lint 规则、清理存量告警（见本次变更报告）后，再单独 PR 引入 lint-staged。
# =============================================================================

default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # ---- 基础文件卫生（跨语言） ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      # 私钥/证书防泄露：轻量、纯 Python、离线可用（无需外部二进制）
      - id: detect-private-key

  # ---- 后端 ruff：仅作用于 backend/，做 lint（含自动修复）与 format 检查 ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (backend lint)
        files: ^backend/
        types_or: [python]
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (backend format)
        files: ^backend/
        types_or: [python]

  # ---- 密钥泄露扫描（gitleaks，比 detect-private-key 更全面） ----
  # 离线安装见文件顶部「离线 / 内网可用性说明」；如需更轻量只保留上面的
  # detect-private-key，可整段注释或 `SKIP=gitleaks`。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
