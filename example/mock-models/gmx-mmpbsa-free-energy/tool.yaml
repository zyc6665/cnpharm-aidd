api_version: aidd.sciminer/tool-package
kind: ToolPackage
metadata:
  slug: gmx-mmpbsa-free-energy
  name: gmx_MMPBSA Mock Free Energy
  version: 0.1.0
  description: MM/GBSA binding free energy mock, standard molecule_table@1 output.
  mock: true
artifacts:
  inputs:
  - name: trajectory
    type: md_trajectory@1
    required: true
  outputs:
  - name: energies
    type: molecule_table@1
    required: true
  - name: report
    type: run_report@1
    required: true
parameters_schema:
  type: object
  properties:
    method:
      type: string
      enum:
      - mmpbsa
      - mmgbsa
      default: mmgbsa
    frames:
      type: integer
      default: 100
      minimum: 1
      maximum: 5000
    seed:
      type: integer
      default: 42
  additionalProperties: false
adapter:
  input:
  - input: trajectory
    method: mount_trajectory_standard_files
  output:
  - output: energies
    method: collect_energies_standard_artifact
  - output: report
    method: collect_report_standard_artifact
exposure:
  agent: true
  workflow: true
  direct_run: true
runtime:
  python: '3.10'
  cuda: '11.8'
  executor_support:
  - ssh_docker_exec
  - slurm
  - k8s_job
  selection_policy: prefer container image by immutable digest; fallback to conda_pack
    only when the executor cannot run containers
  artifacts:
    primary:
      kind: container
      image: harbor.drp.local/drp/compute-gmx-mmpbsa-free-energy:0.1.0-dtk26.04-py3.10
      image_digest: sha256:ee8aad46bc240469ed653ef6caf41a8d35babd358b4ff5c538c6c297722953cf
      includes:
      - python
      - rdkit
    fallback:
      kind: conda_pack
      uri: artifacts://model-envs/gmx-mmpbsa-free-energy/0.1.0/conda-env.tar.gz
      sha256: 81b19eb09b17b46e4d9d457498eef35234b5db2273f9159fdfaaa40fd21b8fb7
      includes:
      - python
      - rdkit
  weights:
    manifest_uri: artifacts://model-weights/gmx-mmpbsa-free-energy/0.1.0/weights.json
    manifest_sha256: d5e03b94b50bd73fb4b0558fb9a06c2e554898f222a54c1d8b70344024c7d8d7
  cache_policy:
    key_fields:
    - metadata.slug
    - metadata.version
    - runtime.artifacts.selected.digest_or_sha256
    - runtime.weights.manifest_sha256
    mutable_host_paths_forbidden: true
variants:
- variants/mock-local.yaml
- variants/haiguang-dcu.yaml
