name: nvidia-cuda
accelerator: nvidia_cuda
executor_types:
  - container
  - remote_job
image: registry.example.invalid/aidd/protein-pocket-template:1.0.0-cuda
entrypoint:
  - bash
  - runner/entrypoint.sh
resources:
  cpu: 4
  memory_mb: 16384
  gpu_memory_mb: 8192
  devices:
    - nvidia.com/gpu
  driver: ">=535"
validation_status: validated
hardware_validated: true
inputs:
  - protein_structure
outputs:
  - pocket_result
  - run_report
