version: '3.8'

services:
  simple-tool:
    build: .
    container_name: simple-text-tool
    ports:
      - "9502:8000"
    networks:
      - cpumodel
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cpumodel:
    external: true
