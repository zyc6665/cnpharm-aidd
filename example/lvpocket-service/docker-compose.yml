# ============================================================================
# LVPocket Service Docker Compose 配置 - 现代化方案 A
# ============================================================================
#
# 基于 NVIDIA NGC TensorFlow 1.15 镜像 (Python 3.8, CUDA 11.x)
#
# 使用方法:
#   1. 首次构建并启动:
#      docker compose up -d --build
#
#   2. 仅启动（已构建）:
#      docker compose up -d
#
#   3. 查看日志:
#      docker compose logs -f lvpocket-service
#
#   4. 停止服务:
#      docker compose down
#
#   5. 重新构建（无缓存）:
#      docker compose build --no-cache
#
#   6. 进入容器调试:
#      docker compose exec lvpocket-service bash
#
#   7. 查看服务状态:
#      docker compose ps
#
# 前置条件:
#   - Docker >= 20.10 (支持 docker compose V2)
#   - NVIDIA Container Toolkit（GPU 支持）
#   - 下载模型文件到 model/LVpocket/trained_model/
#     下载地址: https://doi.org/10.5281/zenodo.10633690
#
# ============================================================================

services:
  lvpocket-service:
    # ========== 构建配置 ==========
    build:
      context: .
      dockerfile: Dockerfile
      # 构建参数（可选）
      args:
        - OPENBABEL_VERSION=3.1.1

    # 镜像名称和标签
    image: lvpocket-service:1.0.0

    # 容器名称
    container_name: lvpocket-service

    # 重启策略
    restart: unless-stopped

    # ========== GPU 配置 ==========
    # 需要 NVIDIA Container Toolkit
    # 安装: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all           # 使用所有可用 GPU，或指定 count: 1
              capabilities: [gpu]
        # 可选：资源限制
        # limits:
        #   memory: 16G

    # ========== 端口映射 ==========
    ports:
      - "9502:8000"

    # ========== 环境变量 ==========
    environment:
      # ----- 服务配置 -----
      - APP_NAME=LVPocket Service
      - APP_VERSION=1.0.0
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1

      # ----- LVpocket 源码路径 -----
      - LVPOCKET_SOURCE_PATH=/app/model/LVpocket

      # ----- 模型配置 -----
      - MODEL_DIR=/app/model/LVpocket/trained_model
      - MODEL_PATH=/app/model/LVpocket/trained_model/scale_0.5_1.h5
      - MODEL_VERSION=1.0.0
      - SCALE=0.5
      - MAX_DIST=35.0

      # ----- SCOP 结构分类配置 -----
      # baseline | alpha | beta | alpha_beta | alpha_plus_beta
      - DEFAULT_STRUCTURE_CLASS=baseline

      # ----- 预测参数 -----
      - DEFAULT_THRESHOLD=0.5
      - DEFAULT_MIN_SIZE=50

      # ----- 文件配置 -----
      - MAX_FILE_SIZE=52428800
      - REQUEST_TIMEOUT=300

      # ----- GPU/TensorFlow 配置 -----
      - CUDA_VISIBLE_DEVICES=0
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - TF_CPP_MIN_LOG_LEVEL=2
      # 禁用 TF 自动混合精度（保持模型兼容）
      - TF_ENABLE_AUTO_MIXED_PRECISION=0

    # ========== 数据卷挂载 ==========
    volumes:
      # 应用代码（开发模式可热重载）
      - ./app:/app/app:rw

      # 模型和 LVpocket 源码（只读）
      - ./model:/app/model:ro

      # 输入/输出文件目录
      - ./data/input:/app/data/input:rw
      - ./data/output:/app/data/output:rw

      # 临时文件卷
      - lvpocket-temp:/tmp/lvpocket

    # ========== 健康检查 ==========
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s      # NGC 镜像较大，启动时间增加

    # ========== 日志配置 ==========
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    # ========== 网络配置 ==========
    networks:
      - cpumodel

# ========== Docker 卷定义 ==========
volumes:
  lvpocket-temp:
    driver: local

# ========== 网络定义 ==========
networks:
  cpumodel:
    driver: bridge

# ============================================================================
# 常用命令速查
# ============================================================================
#
# 构建并启动:
#   docker compose up -d --build
#
# 查看日志:
#   docker compose logs -f
#
# 停止并删除:
#   docker compose down
#
# 停止并删除（包括卷）:
#   docker compose down -v
#
# 重启服务:
#   docker compose restart
#
# 进入容器:
#   docker compose exec lvpocket-service bash
#
# 查看资源使用:
#   docker stats lvpocket-service
#
# ============================================================================
# CPU 模式（无 GPU）
# ============================================================================
#
# 如果没有 GPU，注释掉 deploy 部分，并设置:
#   environment:
#     - CUDA_VISIBLE_DEVICES=""
#
# ============================================================================
