api_version: aidd.sciminer/tool-package.v2
kind: ToolPackage
metadata:
  slug: molp-pc-property-prediction
  name: MolP-PC Property Prediction
  version: 0.1.0
  description: Adapt MolP-PC ADMET prediction CSV outputs to standard molecule_table@1 artifacts.
artifacts:
  inputs:
    - name: molecules
      type: molecule_table@1
      required: true
  outputs:
    - name: properties
      type: molecule_table@1
      cardinality: one
      required: true
    - name: report
      type: run_report@1
      cardinality: one
      required: false
parameters_schema:
  type: object
  properties:
    task_groups:
      type: array
      items:
        type: string
        enum:
          - Absorption
          - Distribution
          - Excretion
          - Metabolism
          - Toxicology
          - Tox21
          - Ecotoxicity
          - LD50
      default:
        - Absorption
        - Distribution
        - Excretion
        - Metabolism
        - Toxicology
        - Tox21
        - Ecotoxicity
        - LD50
      description: Requested ADMET task groups. Current legacy runtime emits all configured groups.
  additionalProperties: false
adapter:
  input:
    - input: molecules
      method: mount_molecule_table_with_smiles_column
  output:
    - output: properties
      method: collect_molp_pc_predictions_as_molecule_table_v1
      validator_profile: molecule_table_v1_core
    - output: report
      method: collect_adapter_report_json
      validator_profile: run_report_v1_core
exposure:
  agent: true
  workflow: true
  direct_run: true
runtime:
  python: "3.8"
  cuda: "11.3"
  executor_support:
    - ssh_docker_exec
    - slurm
    - k8s_job
  selection_policy: "prefer container image by immutable digest; fallback to conda_pack only when the executor cannot run containers"
  artifacts:
    primary:
      kind: container
      image: registry.example/sciminer/molp-pc-runtime:0.1.0
      image_digest: "sha256:4444444444444444444444444444444444444444444444444444444444444444"
      includes:
        - python
        - cuda_runtime
        - dependencies
        - runtime_wrapper
    fallback:
      kind: conda_pack
      uri: artifacts://model-envs/molp-pc-property-prediction/0.1.0/conda-env.tar.gz
      sha256: "5555555555555555555555555555555555555555555555555555555555555555"
      includes:
        - python
        - dependencies
  weights:
    manifest_uri: artifacts://model-weights/molp-pc-property-prediction/0.1.0/weights.json
    manifest_sha256: "6666666666666666666666666666666666666666666666666666666666666666"
  cache_policy:
    key_fields:
      - metadata.slug
      - metadata.version
      - runtime.artifacts.selected.digest_or_sha256
      - runtime.weights.manifest_sha256
    mutable_host_paths_forbidden: true
variants:
  - name: cpu
    accelerator: cpu
    executor_types:
      - remote_job
    entrypoint:
      - runner/entrypoint.sh
    resources:
      cpu: 8
      memory_mb: 16384
    validation_status: unvalidated
    hardware_validated: false
  - name: nvidia-cuda
    accelerator: nvidia_cuda
    executor_types:
      - remote_job
    entrypoint:
      - runner/entrypoint.sh
    resources:
      cpu: 8
      memory_mb: 24576
      gpu_memory_mb: 16384
      devices:
        - nvidia.com/gpu
      driver: ">=535"
    validation_status: unvalidated
    hardware_validated: false
