api_version: aidd.sciminer/tool-package.v2
kind: ToolPackage
metadata:
  slug: rdkit-molecular-properties
  name: RDKit Molecular Properties
  version: 0.1.0
  description: Calculate common RDKit molecular descriptors from a standard molecule table.
artifacts:
  inputs:
    - name: molecules
      type: molecule_table@1
      required: true
  outputs:
    - name: properties
      type: molecule_table@1
      cardinality: one
      required: true
    - name: report
      type: run_report@1
      cardinality: one
      required: false
parameters_schema:
  type: object
  properties:
    smiles_field:
      type: string
      default: SMILES
      minLength: 1
      description: Column containing input SMILES strings.
    molecule_id_field:
      type: string
      default: molecule_id
      minLength: 1
      description: Molecule identifier column for legacy requests.
    device:
      type: string
      enum:
        - cpu
      default: cpu
  additionalProperties: false
adapter:
  input:
    - input: molecules
      method: mount_molecule_table_with_smiles_column
  output:
    - output: properties
      method: collect_rdkit_property_table
      validator_profile: molecule_table_v1_core
    - output: report
      method: collect_rdkit_property_report
      validator_profile: run_report_v1_core
exposure:
  agent: true
  workflow: true
  direct_run: true
runtime:
  python: "3.10"
  cuda: null
  executor_support:
    - ssh_docker_exec
    - slurm
    - k8s_job
  selection_policy: "prefer container image by immutable digest; fallback to conda_pack only when the executor cannot run containers"
  artifacts:
    primary:
      kind: container
      image: registry.example/sciminer/rdkit-properties-runtime:0.1.0
      image_digest: "sha256:7777777777777777777777777777777777777777777777777777777777777777"
      includes:
        - python
        - rdkit
        - runtime_wrapper
    fallback:
      kind: conda_pack
      uri: artifacts://model-envs/rdkit-molecular-properties/0.1.0/conda-env.tar.gz
      sha256: "8888888888888888888888888888888888888888888888888888888888888888"
      includes:
        - python
        - rdkit
  weights:
    manifest_uri: artifacts://model-weights/rdkit-molecular-properties/0.1.0/no-weights.json
    manifest_sha256: "9999999999999999999999999999999999999999999999999999999999999999"
  cache_policy:
    key_fields:
      - metadata.slug
      - metadata.version
      - runtime.artifacts.selected.digest_or_sha256
      - runtime.weights.manifest_sha256
    mutable_host_paths_forbidden: true
variants:
  - name: cpu
    accelerator: cpu
    executor_types:
      - remote_job
    entrypoint:
      - runner/platform_run_v2.sh
    resources:
      cpu: 2
      memory_mb: 4096
    validation_status: validated
    hardware_validated: true
