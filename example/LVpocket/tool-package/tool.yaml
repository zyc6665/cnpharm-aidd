api_version: aidd.sciminer/tool-package
kind: ToolPackage
metadata:
  slug: lvpocket-standard-pocket
  name: LVpocket Standard Pocket Adapter
  version: 1.0.0
  description: Adapt LVpocket pocket prediction outputs to the platform binding_pocket@1 contract.
artifacts:
  inputs:
    - name: protein
      type: protein_structure@1
      required: true
      role_preferences:
        - prepared_pdb
        - structure_file
      readiness_policy: prefer_prepared_warn_raw
      suggested_preparation_tool: builtin-protein-preparation
  outputs:
    - name: pocket
      type: binding_pocket@1
      cardinality: one
      required: true
    - name: report
      type: run_report@1
      cardinality: one
      required: false
parameters_schema:
  type: object
  properties:
    model_choice:
      type: string
      enum:
        - auto
        - all_scpdb
        - alpha
        - beta
        - alpha_beta
        - alpha_and_beta
      default: auto
  additionalProperties: false
adapter:
  input:
    - input: protein
      method: mount_primary_structure_file
  output:
    - output: pocket
      method: convert_lvpocket_voxel_output_to_binding_pocket_v1
      validator_profile: binding_pocket_v1_core
    - output: report
      method: collect_adapter_report_json
      validator_profile: run_report_v1_core
exposure:
  agent: true
  workflow: true
  direct_run: true
runtime:
  python: "3.10"
  cuda: "11.8"
  executor_support:
    - ssh_docker_exec
    - slurm
    - k8s_job
  selection_policy: "prefer container image by immutable digest; fallback to conda_pack only when the executor cannot run containers"
  artifacts:
    primary:
      kind: container
      image: registry.example/sciminer/lvpocket-runtime:1.0.0
      image_digest: "sha256:7777777777777777777777777777777777777777777777777777777777777777"
      includes:
        - python
        - cuda_runtime
        - dependencies
        - runtime_wrapper
    fallback:
      kind: conda_pack
      uri: artifacts://model-envs/lvpocket-standard-pocket/1.0.0/conda-env.tar.gz
      sha256: "8888888888888888888888888888888888888888888888888888888888888888"
      includes:
        - python
        - dependencies
  weights:
    manifest_uri: artifacts://model-weights/lvpocket-standard-pocket/1.0.0/weights.json
    manifest_sha256: "9999999999999999999999999999999999999999999999999999999999999999"
  cache_policy:
    key_fields:
      - metadata.slug
      - metadata.version
      - runtime.artifacts.selected.digest_or_sha256
      - runtime.weights.manifest_sha256
    mutable_host_paths_forbidden: true
variants:
  - name: cpu
    accelerator: cpu
    executor_types:
      - remote_job
    entrypoint:
      - runner/platform_run_v2.sh
    resources:
      cpu: 8
      memory_mb: 16384
    validation_status: validated
    hardware_validated: true
  - name: nvidia-cuda
    accelerator: nvidia_cuda
    executor_types:
      - remote_job
    entrypoint:
      - runner/platform_run_v2.sh
    resources:
      cpu: 8
      memory_mb: 16384
      gpu_memory_mb: 16384
      devices:
        - nvidia.com/gpu
      driver: ">=535"
    validation_status: unvalidated
    hardware_validated: false
  - name: haiguang-dcu
    accelerator: haiguang_dcu
    executor_types:
      - remote_job
    entrypoint:
      - runner/platform_run_v2.sh
    resources:
      cpu: 8
      memory_mb: 16384
      gpu_memory_mb: 16384
      devices:
        - hygon.com/dcu
      driver: ">=6.2"
    validation_status: adapted_pending_hardware_validation
    hardware_validated: false
