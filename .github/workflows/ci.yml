name: SciTool CI

on:
  push:
    branches: [main, develop, 'cnpharm/**']
  pull_request:
    branches: [main, develop, 'cnpharm/**']

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check backend unused imports
        run: python -m flake8 backend/app --select F401

      - name: Run tests
        run: python -m pytest test/ -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npm run test:e2e:deps

      - name: Run Playwright E2E
        run: npm run test:e2e -- --project=chromium --reporter=list --workers=1

  production-compose:
    name: Production Compose Validation
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      REDIS_PASSWORD: ci-only-redis-password
      MINIO_ROOT_USER: ci-only-minio-user
      MINIO_ROOT_PASSWORD: ci-only-minio-password
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
      SETTINGS_ENCRYPTION_KEY: ci-only-settings-key-with-at-least-32-characters
      CORS_ORIGINS: '["https://ci.example.invalid"]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate production Compose configuration
        run: docker compose -f deploy/compose/docker-compose.prod.yml config --quiet

      - name: Build production backend image
        run: docker compose -f deploy/compose/docker-compose.prod.yml build backend
