name: AIDD Platform CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

# 同一分支的连续推送只保留最新一次，避免排队浪费额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: 后端规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: 未使用导入检查（F401）
        run: python -m flake8 backend/app --select F401

      - name: 语法检查（F821 未定义名 / E9 语法错误）
        run: python -m flake8 backend/app --select F821,E9

  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: 运行 pytest
        # `timeout` 是硬兜底，不是优化：整个作业曾因一个 `while True` 的巡检循环
        # 占满事件循环而空转 45 分钟（asyncio 的 cancel/超时都投递不进去，pytest
        # 内部的任何超时机制同样失效）。正常情况下全量约 3 分钟，20 分钟足够，
        # 超时后 `timeout` 会杀掉进程让作业立刻变红，而不是无声挂着。
        timeout-minutes: 20
        run: timeout 900 python -m pytest test/ -v --tb=short

  migrations-postgres:
    name: 迁移链（PostgreSQL）
    runs-on: ubuntu-latest
    # SQLite 不校验外键目标是否存在、也不做跨表依赖检查，迁移链里的悬空外键
    # 与删除顺序问题在 SQLite 上全部是绿灯。交付环境按 docs/13 用 PostgreSQL，
    # 所以这里必须有一个真 PG 的作业：`upgrade head` 与 `downgrade base` 双向
    # 各跑一次。之前 33 次迁移验证全在 SQLite 上，一次上 PG 就暴露了三个缺陷。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_migrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/ci_migrate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: upgrade head
        working-directory: ./backend
        run: python -m alembic upgrade head

      - name: downgrade base
        # 回退路径同样要验证：`downgrade base` 的语义是把库清空，写错会留下残表，
        # 而残表的外键会让后续 re-upgrade 失败。这条只在 PG 上才真正有效。
        working-directory: ./backend
        run: python -m alembic downgrade base

      - name: 确认库已清空
        working-directory: ./backend
        run: |
          python - <<'PY'
          import asyncio
          import os

          import sqlalchemy as sa
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main() -> None:
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  rows = await conn.execute(sa.text(
                      "select table_name from information_schema.tables "
                      "where table_schema='public' and table_name <> 'alembic_version'"
                  ))
                  remaining = [row[0] for row in rows]
              await engine.dispose()
              assert not remaining, f"downgrade base 后仍有残留表: {remaining}"
              print("downgrade base 后无残留表")

          asyncio.run(main())
          PY

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build

  frontend-test:
    name: 前端单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行 vitest
        run: npm run test

  frontend-e2e:
    name: 前端 E2E
    runs-on: ubuntu-latest
    # E2E 较慢，只在主干与发布分支跑，功能分支靠单元测试把关
    if: github.event_name == 'push' || github.base_ref == 'main'
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器与系统依赖
        run: npm run test:e2e:deps

      - name: 运行 Playwright
        run: npm run test:e2e -- --project=chromium --reporter=list --workers=1

  offline-check:
    name: 离线合规扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描公网域名与外部 API 调用
        run: python scripts/check_offline_compliance.py

  compose-check:
    name: 部署配置校验
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      REDIS_PASSWORD: ci-only-redis-password
      MINIO_ROOT_USER: ci-only-minio-user
      MINIO_ROOT_PASSWORD: ci-only-minio-password
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
      SETTINGS_ENCRYPTION_KEY: ci-only-settings-key-with-at-least-32-characters
      CORS_ORIGINS: '["https://ci.example.invalid"]'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 校验生产 compose 配置
        run: docker compose -f deploy/compose/docker-compose.prod.yml config --quiet

      - name: 构建后端镜像
        run: docker compose -f deploy/compose/docker-compose.prod.yml build backend

  docs-check:
    name: 文档链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查 docs 内相对链接
        run: python scripts/check_doc_links.py
