services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scitool}
      POSTGRES_USER: ${POSTGRES_USER:-scitool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    # 生产启用 TLS：请把证书挂载到 /certs 并保持 MINIO_SECURE=true。
    command: server /data --address ":9000" --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
      - ${MINIO_CERTS_DIR:?set MINIO_CERTS_DIR to the TLS certificate directory}:/certs:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    image: scitool-backend:${APP_VERSION:-latest}
    build:
      context: ../../backend
      target: production
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9501}:8000"
    environment: &app_environment
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scitool}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scitool}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_BACKEND: redis
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-scitool-files}
      # 生产必须走 TLS。当前 compose 的 MinIO 服务需挂载证书（--certs-dir）
      # 或由同一网络内 TLS 终止代理转发，否则启动后将无法连接对象存储。
      MINIO_SECURE: "true"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      TASK_EXECUTION_BACKEND: celery
      WORKER_CAPABILITY_ADMISSION_ENABLED: "true"
      WORKER_CAPABILITY_ROUTING_ENABLED: "true"
      WORKER_CAPABILITY_RESERVATION_ENABLED: "true"
      RESOURCE_SCOPE_QUOTA_ENABLED: "true"
      TASK_CANCELLATION_STALE_AFTER_SECONDS: ${TASK_CANCELLATION_STALE_AFTER_SECONDS:-900}
      TASK_CANCELLATION_RECONCILE_BATCH_SIZE: ${TASK_CANCELLATION_RECONCILE_BATCH_SIZE:-100}
      WORKFLOW_RECONCILE_LOCK_TTL_SECONDS: ${WORKFLOW_RECONCILE_LOCK_TTL_SECONDS:-60}
      REMOTE_CANCEL_RETRY_INTERVAL_SECONDS: ${REMOTE_CANCEL_RETRY_INTERVAL_SECONDS:-60}
      REMOTE_CANCEL_RETRY_BATCH_SIZE: ${REMOTE_CANCEL_RETRY_BATCH_SIZE:-100}
      RESOURCE_USER_MAX_CPU: ${RESOURCE_USER_MAX_CPU:-16}
      RESOURCE_USER_MAX_MEMORY_GB: ${RESOURCE_USER_MAX_MEMORY_GB:-64}
      RESOURCE_USER_MAX_PARALLELISM: ${RESOURCE_USER_MAX_PARALLELISM:-4}
      RESOURCE_PROJECT_MAX_CPU: ${RESOURCE_PROJECT_MAX_CPU:-64}
      RESOURCE_PROJECT_MAX_MEMORY_GB: ${RESOURCE_PROJECT_MAX_MEMORY_GB:-256}
      RESOURCE_PROJECT_MAX_PARALLELISM: ${RESOURCE_PROJECT_MAX_PARALLELISM:-16}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    image: scitool-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4} --queues=default,tool_tasks,high_priority,cpu_queue,maintenance,monitoring
    environment:
      <<: *app_environment
      WORKER_LISTEN_QUEUES: default,tool_tasks,high_priority,cpu_queue,maintenance,monitoring
      # Worker 用 null 池：asyncpg 连接绑定事件循环，threads/prefork 池下共享池会跨循环
      DB_POOL_MODE: null
      WORKER_CAPABILITY_JSON: '{"worker_id":"scitool-default-$${HOSTNAME}","queue":"tool_tasks","tiers":["cpu","standard"],"cpu_capacity":8,"memory_capacity_gb":32,"gpu_count":0,"parallelism":4}'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  celery-worker-heavy:
    image: scitool-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_HEAVY_WORKER_CONCURRENCY:-1} --queues=heavy_compute
    environment:
      <<: *app_environment
      WORKER_LISTEN_QUEUES: heavy_compute
      # Worker 用 null 池：asyncpg 连接绑定事件循环，threads/prefork 池下共享池会跨循环
      DB_POOL_MODE: null
      WORKER_CAPABILITY_JSON: '{"worker_id":"scitool-heavy-$${HOSTNAME}","queue":"heavy_compute","tiers":["heavy"],"cpu_capacity":16,"memory_capacity_gb":64,"gpu_count":0,"parallelism":1}'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  celery-worker-gpu:
    image: scitool-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    profiles: ["gpu"]
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_GPU_WORKER_CONCURRENCY:-1} --queues=gpu_queue
    environment:
      <<: *app_environment
      WORKER_LISTEN_QUEUES: gpu_queue
      # Worker 用 null 池：asyncpg 连接绑定事件循环，threads/prefork 池下共享池会跨循环
      DB_POOL_MODE: null
      WORKER_CAPABILITY_JSON: '{"worker_id":"scitool-gpu-$${HOSTNAME}","queue":"gpu_queue","tiers":["gpu"],"cpu_capacity":8,"memory_capacity_gb":32,"gpu_count":1,"parallelism":1}'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  celery-beat:
    image: scitool-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      <<: *app_environment
      WORKER_CAPABILITY_HEARTBEAT_QUEUES: default,heavy_compute,gpu_queue
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  minio_data:
