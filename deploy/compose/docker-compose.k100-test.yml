name: sciminer-k100-test

x-app-environment: &app_environment
  APP_NAME: 科学计算工具管理平台
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scitool}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scitool}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CACHE_BACKEND: ${CACHE_BACKEND:-redis}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET:-scitool-files}
  MINIO_SECURE: "false"
  MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-1024}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  CELERY_TIMEZONE: Asia/Shanghai
  TASK_EXECUTION_BACKEND: ${TASK_EXECUTION_BACKEND:-celery}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS}
  AIDD_PROJECT_WORKSPACE_ENABLED: ${AIDD_PROJECT_WORKSPACE_ENABLED:-true}
  AIDD_PROJECT_CONVERSATIONS_ENABLED: ${AIDD_PROJECT_CONVERSATIONS_ENABLED:-true}
  PROJECT_RESEARCH_BOARD_ENABLED: ${PROJECT_RESEARCH_BOARD_ENABLED:-true}
  TOOL_PACKAGE_V1_ENABLED: ${TOOL_PACKAGE_V1_ENABLED:-false}
  LEGACY_AIDD_API_ENABLED: ${LEGACY_AIDD_API_ENABLED:-false}
  DOCKER_REQUIRE_IMAGE_DIGEST_IN_DEPLOYMENT: ${DOCKER_REQUIRE_IMAGE_DIGEST_IN_DEPLOYMENT:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sciminer-k100-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scitool}
      POSTGRES_USER: ${POSTGRES_USER:-scitool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - k100_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sciminer-k100

  redis:
    image: redis:7-alpine
    container_name: sciminer-k100-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - k100_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sciminer-k100

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: sciminer-k100-minio
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - k100_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sciminer-k100

  backend:
    image: sciminer-backend:${APP_VERSION:-k100-test}
    container_name: sciminer-k100-backend
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ./.env.k100-test
    environment: *app_environment
    ports:
      - "${BACKEND_PORT:-9501}:8000"
    volumes:
      - k100_backend_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sciminer-k100

  backend-migrate:
    image: sciminer-backend:${APP_VERSION:-k100-test}
    container_name: sciminer-k100-backend-migrate
    profiles: ["tools"]
    env_file:
      - ./.env.k100-test
    environment: *app_environment
    command: alembic upgrade head
    volumes:
      - k100_backend_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sciminer-k100

  celery-worker:
    image: sciminer-backend:${APP_VERSION:-k100-test}
    container_name: sciminer-k100-celery-worker
    restart: unless-stopped
    env_file:
      - ./.env.k100-test
    environment: *app_environment
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --queues=default,tool_tasks,high_priority,cpu_queue,maintenance,monitoring
      --hostname=k100-worker@sciminer
    volumes:
      - k100_backend_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sciminer-k100

  frontend:
    image: sciminer-frontend:${APP_VERSION:-k100-test}
    container_name: sciminer-k100-frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: ""
        VITE_APP_ENV: production
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8585}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sciminer-k100

volumes:
  k100_postgres_data:
  k100_redis_data:
  k100_minio_data:
  k100_backend_storage:

networks:
  sciminer-k100:
    name: sciminer-k100
    driver: bridge
