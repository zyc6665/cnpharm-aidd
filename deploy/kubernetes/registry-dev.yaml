apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sciminer-registry-data
  namespace: sciminer-storage
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: image-registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciminer-registry
  namespace: sciminer-storage
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: sciminer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
      app.kubernetes.io/part-of: sciminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: sciminer
    spec:
      containers:
        - name: registry
          image: docker.1panel.live/library/registry:3
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: sciminer-registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: sciminer-registry
  namespace: sciminer-storage
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: sciminer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: sciminer
  ports:
    - name: registry
      port: 5000
      targetPort: registry
