apiVersion: v1
kind: Service
metadata:
  name: sciminer-registry-nodeport
  namespace: sciminer-storage
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: development-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: sciminer
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
