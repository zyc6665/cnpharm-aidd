apiVersion: v1
kind: Service
metadata:
  name: sciminer-minio-nodeport
  namespace: sciminer-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: development-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: sciminer
  ports:
    - name: api
      port: 9000
      targetPort: api
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901
