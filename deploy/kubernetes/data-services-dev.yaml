# 单节点 K3s 开发数据服务。
# Secret 不写入此文件；请按 README 创建：
#   sciminer-system/sciminer-postgres-credentials
#   sciminer-system/sciminer-redis-credentials
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sciminer-postgres-data
  namespace: sciminer-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciminer-postgres
  namespace: sciminer-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: sciminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: sciminer
        sciminer.io/purpose: database
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: docker.1panel.live/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sciminer-postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sciminer-postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sciminer-postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sciminer-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: sciminer-postgres
  namespace: sciminer-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: database
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sciminer
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sciminer-redis-data
  namespace: sciminer-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: broker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciminer-redis
  namespace: sciminer-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: sciminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: sciminer
        sciminer.io/purpose: broker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: docker.1panel.live/library/redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sciminer-redis-credentials
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sciminer-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: sciminer-redis
  namespace: sciminer-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: sciminer
    sciminer.io/purpose: broker
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: sciminer
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: 30379
