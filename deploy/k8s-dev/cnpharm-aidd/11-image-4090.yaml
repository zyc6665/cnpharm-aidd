# 4090 集群专用镜像覆盖
#
# 背景：4090 节点出网走镜像加速 docker.1panel.live，该加速对 minio/minio 返回 403，
# 导致 cnpharm-minio 一直 ImagePullBackOff。镜像已推入集群内 registry（30500）。
#
# apply 顺序：
#   kubectl apply -f 00-namespace.yaml
#   kubectl apply -f 10-data-services.yaml
#   kubectl apply -f 11-image-4090.yaml      # 本文件，只覆盖 minio 镜像地址
#
# 换集群 / 节点能直连 Docker Hub 时，可跳过本文件。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpharm-minio
  namespace: cnpharm-aidd
spec:
  selector:
    matchLabels: {app: cnpharm-minio}
  template:
    metadata:
      labels: {app: cnpharm-minio}
    spec:
      containers:
        - name: minio
          image: 10.202.2.228:30500/aidd/minio:RELEASE.2024-06-13T22-53-53Z
          imagePullPolicy: IfNotPresent
