# 中国医药 AIDD 平台 —— 本地开发环境数据服务（PostgreSQL / Redis / MinIO）
#
# 依赖：先执行 00-namespace.yaml；再创建凭据 Secret（不入库，见 README）
#   kubectl -n cnpharm-aidd create secret generic cnpharm-aidd-credentials \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=MINIO_ROOT_USER=... \
#     --from-literal=MINIO_ROOT_PASSWORD=...
#
# NodePort 约定（与 .env 对齐，避免再出现 port-forward 断线问题）：
#   PostgreSQL  30432
#   Redis       30379
#   MinIO S3    30900   MinIO Console 30901
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnpharm-postgres-data
  namespace: cnpharm-aidd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnpharm-redis-data
  namespace: cnpharm-aidd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnpharm-minio-data
  namespace: cnpharm-aidd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpharm-postgres
  namespace: cnpharm-aidd
  labels: {app: cnpharm-postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: cnpharm-postgres}
  template:
    metadata:
      labels: {app: cnpharm-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: scitool
            - name: POSTGRES_USER
              value: scitool
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: POSTGRES_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scitool", "-d", "scitool"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cnpharm-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: cnpharm-postgres
  namespace: cnpharm-aidd
spec:
  type: NodePort
  selector: {app: cnpharm-postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpharm-redis
  namespace: cnpharm-aidd
  labels: {app: cnpharm-redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: cnpharm-redis}
  template:
    metadata:
      labels: {app: cnpharm-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: REDIS_PASSWORD}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cnpharm-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: cnpharm-redis
  namespace: cnpharm-aidd
spec:
  type: NodePort
  selector: {app: cnpharm-redis}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpharm-minio
  namespace: cnpharm-aidd
  labels: {app: cnpharm-minio}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: cnpharm-minio}
  template:
    metadata:
      labels: {app: cnpharm-minio}
    spec:
      containers:
        - name: minio
          # 4090 节点出网走镜像加速 docker.1panel.live，该加速对 minio/minio 返回 403，
          # 直接引用 docker.io 会 ImagePullBackOff。镜像已推入集群内 registry（30500）。
          # 注意：这个 tag 里装的是 bitnami-legacy 构建（minio 二进制 + mc 客户端），
          # 不是官方 minio/minio;所以下面显式给 command/args，不依赖镜像自带 entrypoint。
          # 换集群 / 节点能直连 Docker Hub 时，把 image 换成 minio/minio:<release> 即可，
          # 其余字段（secret 引用、PVC 挂载、command）都要保留。
          image: 10.202.2.228:30500/aidd/minio:bitnami-legacy-2025.5.24
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - exec minio server /data --address ":9000" --console-address ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: MINIO_ROOT_PASSWORD}
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cnpharm-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: cnpharm-minio
  namespace: cnpharm-aidd
spec:
  type: NodePort
  selector: {app: cnpharm-minio}
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
# 幂等建桶：新集群 apply 后 storage 直接可用，不需要人手 mc mb。
# 只跑一次（Job 不会随 apply 重跑；要重跑先 kubectl delete job cnpharm-minio-init）。
apiVersion: batch/v1
kind: Job
metadata:
  name: cnpharm-minio-init
  namespace: cnpharm-aidd
  labels: {app: cnpharm-minio-init}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: cnpharm-minio-init}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: 10.202.2.228:30500/aidd/minio:bitnami-legacy-2025.5.24
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # 该镜像自带 mc；换成官方 minio/minio 镜像时没有 mc，需要另配镜像。
              if ! command -v mc >/dev/null 2>&1; then
                echo "image 内没有 mc，跳过建桶（由部署方手工执行 mc mb）"; exit 0
              fi
              until mc alias set local http://cnpharm-minio:9000 \
                      "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "等待 MinIO 就绪..."; sleep 3
              done
              for b in scitool-files drp-assets drp-bulk drp-logs drp-models drp-results drp-temp; do
                mc mb --ignore-existing "local/$b" >/dev/null
              done
              mc ls local
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: MINIO_ROOT_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
