# 中国医药 AIDD 平台 —— 本地开发环境数据服务（PostgreSQL / Redis / MinIO）
#
# 依赖：先执行 00-namespace.yaml；再创建凭据 Secret（不入库，见 README）
#   kubectl -n cnpharm-aidd create secret generic cnpharm-aidd-credentials \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=MINIO_ROOT_USER=... \
#     --from-literal=MINIO_ROOT_PASSWORD=...
#
# NodePort 约定（与 .env 对齐，避免再出现 port-forward 断线问题）：
#   PostgreSQL  30432
#   Redis       30379
#   MinIO S3    30900   MinIO Console 30901
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnpharm-postgres-data
  namespace: cnpharm-aidd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnpharm-redis-data
  namespace: cnpharm-aidd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnpharm-minio-data
  namespace: cnpharm-aidd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpharm-postgres
  namespace: cnpharm-aidd
  labels: {app: cnpharm-postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: cnpharm-postgres}
  template:
    metadata:
      labels: {app: cnpharm-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: scitool
            - name: POSTGRES_USER
              value: scitool
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: POSTGRES_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scitool", "-d", "scitool"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cnpharm-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: cnpharm-postgres
  namespace: cnpharm-aidd
spec:
  type: NodePort
  selector: {app: cnpharm-postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpharm-redis
  namespace: cnpharm-aidd
  labels: {app: cnpharm-redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: cnpharm-redis}
  template:
    metadata:
      labels: {app: cnpharm-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: REDIS_PASSWORD}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cnpharm-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: cnpharm-redis
  namespace: cnpharm-aidd
spec:
  type: NodePort
  selector: {app: cnpharm-redis}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpharm-minio
  namespace: cnpharm-aidd
  labels: {app: cnpharm-minio}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: cnpharm-minio}
  template:
    metadata:
      labels: {app: cnpharm-minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-06-13T22-53-53Z
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - exec minio server /data --address ":9000" --console-address ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnpharm-aidd-credentials, key: MINIO_ROOT_PASSWORD}
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cnpharm-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: cnpharm-minio
  namespace: cnpharm-aidd
spec:
  type: NodePort
  selector: {app: cnpharm-minio}
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
