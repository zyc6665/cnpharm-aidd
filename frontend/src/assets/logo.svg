<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="中国医药 AI 药物研发平台">
  <!--
    平台标识：六元环（苯环骨架）＋中心原子，取「分子结构」的最简图形语言。
    单色渐变而非固定黄，暗/浅两种主题下都不用换图，折叠态与展开态共用同一份资产。
  -->
  <defs>
    <linearGradient id="aiddMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#aiddMark)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 3.6 26.4 9.6 26.4 21.6 16 27.6 5.6 21.6 5.6 9.6 Z" />
    <path d="M16 10.4 21.4 13.5 21.4 19.7 16 22.8 10.6 19.7 10.6 13.5 Z" opacity="0.55" />
  </g>
  <circle cx="16" cy="16" r="2.6" fill="url(#aiddMark)" />
</svg>
