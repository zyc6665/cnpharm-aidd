api_version: aidd.sciminer/model-package.v1
slug: pocket2mol-pocket-ligand-generation
name: Pocket2Mol Pocket Ligand Generation Runtime
version: 0.1.2
entrypoint: platform_run.sh
description: Model-side runtime adapter that maps standard binding_pocket@1 inputs to the legacy Pocket2Mol sampling entrypoint.
runtime:
  python: "3.10"
  cuda: "11.8"
  executor_support:
    - ssh_docker_exec
    - slurm
    - k8s_job
  artifacts:
    primary:
      kind: container
      image: registry.example/sciminer/pocket2mol-runtime:0.1.2
      image_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    fallback:
      kind: conda_pack
      uri: artifacts://model-envs/pocket2mol-pocket-ligand-generation/0.1.2/conda-env.tar.gz
      sha256: 2222222222222222222222222222222222222222222222222222222222222222
  weights:
    manifest_uri: artifacts://model-weights/pocket2mol-pocket-ligand-generation/0.1.2/weights.json
    manifest_sha256: 3333333333333333333333333333333333333333333333333333333333333333
  selection_policy: prefer immutable runtime artifact digest and weight manifest hash
  cache_policy:
    key_fields:
      - slug
      - version
      - runtime.artifacts.primary.image_digest
      - runtime.weights.manifest_sha256
    mutable_host_paths_forbidden: true
model_code:
  wrapper_package: src/pocket2mol_runtime
  legacy_entrypoint_env: POCKET2MOL_LEGACY_ENTRYPOINT
standard_contract:
  inputs:
    - name: pocket
      type: binding_pocket@1
  outputs:
    - name: molecules
      type: molecule_table@1
    - name: ligands
      type: ligand_structure@1
    - name: report
      type: run_report@1
