schema_version: sciminer.model-package.v1
slug: lvpocket-standard-pocket
name: LVpocket Standard Pocket Runtime
version: 1.0.0
entrypoint: platform_run.sh
runtime:
  python: "3.10"
  cuda: "11.8"
  executor_support:
    - ssh_docker_exec
    - slurm
    - k8s_job
  selection_policy: "prefer container image by immutable digest; fallback to conda_pack only when the executor cannot run containers"
  artifacts:
    primary:
      kind: container
      image: registry.example/sciminer/lvpocket-runtime:1.0.0
      image_digest: sha256:<to-be-built-image-digest>
      includes:
        - python
        - cuda_runtime
        - dependencies
        - runtime_wrapper
    fallback:
      kind: conda_pack
      uri: artifacts://model-envs/lvpocket-standard-pocket/1.0.0/conda-env.tar.gz
      sha256: <to-be-built-conda-pack-sha256>
      includes:
        - python
        - dependencies
  cache_policy:
    key_fields:
      - slug
      - version
      - runtime.artifacts.selected.digest_or_sha256
      - weights.manifest_sha256
    mutable_host_paths_forbidden: true
model_code:
  source_dir: original_model
  wrapper_package: src/lvpocket_runtime
  legacy_entrypoint_env: LVPOCKET_LEGACY_ENTRYPOINT
weights:
  directory: weights
  required_patterns:
    - "*.hdf"
standard_contract:
  inputs:
    - name: protein
      type: protein_structure@1
  outputs:
    - name: pocket
      type: binding_pocket@1
    - name: report
      type: run_report@1
excluded_from_git:
  - weights/*
  - original_model/*
  - wheelhouse/*.whl
  - deployment.local.*
  - platform_tool.ssh_job.json
