schema_version: sciminer.model-package.v1
slug: molp-pc-property-prediction
name: MolP-PC Property Prediction
version: 0.1.1
entrypoint: platform_run.sh
runtime:
  python: "3.8"
  cuda: "11.3"
  environment_file: admet.yml
  requirements_file: requirements.txt
  executor_support:
    - ssh_docker_exec
    - slurm
    - k8s_job
  selection_policy: "prefer container image by immutable digest; fallback to conda_pack only when the executor cannot run containers"
  artifacts:
    primary:
      kind: container
      image: registry.example/sciminer/molp-pc-runtime:0.1.1
      image_digest: sha256:<to-be-built-image-digest>
      includes:
        - python
        - cuda_runtime
        - dependencies
        - runtime_wrapper
    fallback:
      kind: conda_pack
      uri: artifacts://model-envs/molp-pc-property-prediction/0.1.1/conda-env.tar.gz
      sha256: <to-be-built-conda-pack-sha256>
      includes:
        - python
        - dependencies
  cache_policy:
    key_fields:
      - slug
      - version
      - runtime.artifacts.selected.digest_or_sha256
      - weights.manifest_sha256
    mutable_host_paths_forbidden: true
model_code:
  source_dir: predict
  wrapper_package: src/molp_pc_runtime
  legacy_entrypoint: predict/test.py::predict(path, name)
weights:
  directory: predict/model
  required_files:
    - Absorption.pth
    - Distribution.pth
    - Ecotoxicity.pth
    - Excretion.pth
    - LD50.pth
    - Metabolism.pth
    - Tox21.pth
    - Toxicology.pth
standard_contract:
  inputs:
    - name: molecules
      type: molecule_table@1
  outputs:
    - name: properties
      type: molecule_table@1
    - name: report
      type: run_report@1
excluded_from_git:
  - predict/model/*.pth
  - wheelhouse/*.whl
  - platform_tool.ssh_job.json
  - predict/cb_data_fine.csv
