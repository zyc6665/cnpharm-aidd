api_version: aidd.sciminer/tool-template.v1
kind: ToolTemplate
metadata:
  template_key: openbabel-converter
  slug: openbabel-converter
  name: Open Babel Format Converter
  version: 1.0.0
  description: Convert ligand structures between SDF, MOL2, PDB, and PDBQT-compatible formats.
  family: drug_discovery
executor_types: [docker_image, ssh_job, remote_api]
input_schema:
  type: object
  properties:
    output_format: { type: string, enum: [sdf, mol2, pdb, pdbqt], default: sdf }
    add_hydrogens: { type: boolean, default: true }
  required: [output_format]
output_schema:
  type: object
  properties:
    result_version: { const: aidd.sciminer/result.v2 }
    artifacts: { type: array }
    summary: { type: object }
agent_capability:
  enabled: true
  capability: ligand_format_conversion
  stage: ligand_preparation
  inputs:
    - semantic_type: ligand_structure@1
      field: ligand
      accepted_extensions: [.sdf, .mol2, .pdb]
  outputs:
    - semantic_type: ligand_structure@1
      source: output_files
      match: { filename_contains_any: [converted, ligand] }
    - semantic_type: run_report@1
      source: output_files
      match: { extension: .json, filename_contains_any: [report] }
      required: false
  defaults:
    output_format: sdf
    add_hydrogens: true
resource_profile:
  tier: light
  cpu: 2
  memory_gb: 4
  gpu_required: false
  gpu_memory_gb: 0
  expected_minutes: 3
  timeout_minutes: 30
  scheduler_hint: local
sample_inputs:
  - name: smoke
    params: { output_format: sdf, add_hydrogens: true }
    artifacts: { ligand: examples/ligand.sdf }
smoke_test:
  name: openbabel-converter-smoke
  params: { output_format: sdf, add_hydrogens: true }
  input_artifacts: { ligand: examples/ligand.sdf }
  expected_result_version: aidd.sciminer/result.v2
  expected_outputs:
    - semantic_type: ligand_structure@1
      role: structure_file
    - semantic_type: run_report@1
      role: report_json
      required: false
