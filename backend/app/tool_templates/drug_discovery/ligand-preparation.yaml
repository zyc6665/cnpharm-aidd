api_version: aidd.sciminer/tool-template.v1
kind: ToolTemplate
metadata:
  template_key: ligand-preparation
  slug: ligand-preparation
  name: Ligand Preparation
  version: 1.0.0
  description: Normalize ligand protonation, hydrogens, charges, and docking-ready structure roles.
  family: drug_discovery
executor_types: [docker_image, ssh_job, k8s_job]
input_schema:
  type: object
  properties:
    ph: { type: number, default: 7.4 }
    output_format: { type: string, enum: [sdf, mol2, pdbqt], default: sdf }
  required: [ph, output_format]
output_schema:
  type: object
  properties:
    result_version: { const: aidd.sciminer/result.v2 }
    artifacts: { type: array }
    summary: { type: object }
agent_capability:
  enabled: true
  capability: ligand_preparation
  stage: ligand_preparation
  inputs:
    - semantic_type: ligand_structure@1
      field: ligand
      accepted_extensions: [.sdf, .mol2, .pdb]
  outputs:
    - semantic_type: ligand_structure@1
      source: output_files
      match: { filename_contains_any: [prepared, ligand] }
    - semantic_type: run_report@1
      source: output_files
      match: { extension: .json, filename_contains_any: [preparation, report] }
      required: false
  defaults:
    ph: 7.4
    output_format: sdf
artifacts:
  inputs:
    - name: ligand
      type: ligand_structure@1
      required: true
      role_preferences: [structure_3d_sdf, structure_file, structure_2d_sdf]
      readiness_policy: allow_raw
  outputs:
    - name: ligand
      type: ligand_structure@1
      required: true
      provided_roles: [structure_3d_sdf, structure_file]
    - name: report
      type: run_report@1
      required: false
      provided_roles: [report_json]
implementation:
  source: open_source
  provider: RDKit and Open Babel
  runtime: rdkit_openbabel
  project_url: https://www.rdkit.org/
  recommended_executor: docker_image
  notes: Combine RDKit normalization with Open Babel format and hydrogen handling.
resource_profile:
  tier: light
  cpu: 2
  memory_gb: 4
  gpu_required: false
  gpu_memory_gb: 0
  expected_minutes: 5
  timeout_minutes: 30
  scheduler_hint: local
sample_inputs:
  - name: smoke
    params: { ph: 7.4, output_format: sdf }
    artifacts: { ligand: examples/ligand.sdf }
smoke_test:
  name: ligand-preparation-smoke
  params: { ph: 7.4, output_format: sdf }
  input_artifacts: { ligand: examples/ligand.sdf }
  expected_result_version: aidd.sciminer/result.v2
  expected_outputs:
    - semantic_type: ligand_structure@1
      role: structure_file
    - semantic_type: run_report@1
      role: report_json
      required: false
