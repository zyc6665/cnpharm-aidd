api_version: aidd.sciminer/tool-template.v1
kind: ToolTemplate
metadata:
  template_key: rdkit-sa-score
  slug: rdkit-sa-score
  name: RDKit Synthetic Accessibility Score
  version: 1.0.0
  description: Calculate synthetic accessibility scores for a molecule table.
  family: drug_discovery
executor_types: [python_script, docker_image, ssh_job, remote_api]
input_schema:
  type: object
  properties:
    smiles_column: { type: string, default: smiles }
  required: [smiles_column]
output_schema:
  type: object
  properties:
    result_version: { const: aidd.sciminer/result.v2 }
    artifacts: { type: array }
    summary: { type: object }
agent_capability:
  enabled: true
  capability: synthetic_accessibility
  stage: synthetic_accessibility
  inputs:
    - semantic_type: molecule_table@1
      field: molecules
      accepted_extensions: [.csv, .smi, .txt]
  outputs:
    - semantic_type: run_report@1
      source: output_files
      match: { extension: .json, filename_contains_any: [synthetic, sa] }
    - semantic_type: molecule_table@1
      source: output_files
      match: { extension: .csv, filename_contains_any: [sa, synthetic] }
      required: false
  defaults:
    smiles_column: smiles
resource_profile:
  tier: light
  cpu: 2
  memory_gb: 4
  gpu_required: false
  gpu_memory_gb: 0
  expected_minutes: 2
  timeout_minutes: 15
  scheduler_hint: local
sample_inputs:
  - name: smoke
    params: { smiles_column: smiles }
    artifacts: { molecules: examples/smiles.csv }
smoke_test:
  name: rdkit-sa-score-smoke
  params: { smiles_column: smiles }
  input_artifacts: { molecules: examples/smiles.csv }
  expected_result_version: aidd.sciminer/result.v2
  expected_outputs:
    - semantic_type: run_report@1
      role: report_json
    - semantic_type: molecule_table@1
      role: table_file
      required: false
