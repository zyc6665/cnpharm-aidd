api_version: aidd.sciminer/tool-template.v1
kind: ToolTemplate
metadata:
  template_key: md-gromacs-ssh
  slug: md-gromacs-ssh
  name: GROMACS MD Simulation
  version: 1.0.0
  description: Template for heavy molecular dynamics jobs on SSH or remote compute services.
  family: drug_discovery
executor_types: [ssh_job, remote_api, k8s_job]
input_schema:
  type: object
  properties:
    simulation_ns: { type: number, minimum: 0.01, default: 1 }
    temperature_k: { type: number, default: 300 }
    pressure_bar: { type: number, default: 1 }
  required: [simulation_ns, temperature_k]
output_schema:
  type: object
  properties:
    result_version: { const: aidd.sciminer/result.v2 }
    artifacts: { type: array }
    summary: { type: object }
agent_capability:
  enabled: true
  capability: molecular_dynamics
  stage: molecular_dynamics
  inputs:
    - semantic_type: protein_structure@1
      field: protein
      accepted_extensions: [.pdb, .cif]
    - semantic_type: ligand_structure@1
      field: ligand
      required: false
      accepted_extensions: [.sdf, .mol2, .pdb]
  outputs:
    - semantic_type: run_report@1
      source: output_files
      match: { extension: .json, filename_contains_any: [md, report] }
  defaults:
    simulation_ns: 1
    temperature_k: 300
implementation:
  source: open_source
  provider: GROMACS
  runtime: gromacs
  project_url: https://www.gromacs.org/
  recommended_executor: ssh_job
  notes: Submit long-running simulations to a dedicated heavy-compute worker or remote cluster.
resource_profile:
  tier: heavy
  cpu: 16
  memory_gb: 64
  gpu_required: true
  gpu_memory_gb: 16
  expected_minutes: 240
  timeout_minutes: 1440
  scheduler_hint: future_cluster
sample_inputs:
  - name: smoke
    params: { simulation_ns: 0.01, temperature_k: 300, pressure_bar: 1 }
    artifacts: { protein: examples/receptor.pdb, ligand: examples/ligand.sdf }
smoke_test:
  name: md-gromacs-ssh-smoke
  params: { simulation_ns: 0.01, temperature_k: 300, pressure_bar: 1 }
  input_artifacts: { protein: examples/receptor.pdb, ligand: examples/ligand.sdf }
  expected_result_version: aidd.sciminer/result.v2
  expected_outputs:
    - semantic_type: run_report@1
      role: report_json
