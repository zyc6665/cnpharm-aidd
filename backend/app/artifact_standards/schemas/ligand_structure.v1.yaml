type: ligand_structure
version: 1
file_roles:
  - role: structure_file
    required: true
    primary: true
    # 主结构文件允许配体的常见交换格式：SDF/MOL/MOL2/PDB。
    # LDDM 等生成模型的 fragment/参考配体输入原本就是这几种格式，
    # 适配器侧统一转换成 SDF 再推理（见 deploy/model-images/k8s/lddm）。
    allowed_formats: [sdf, mol, mol2, pdb]
    content_types:
      - chemical/x-mdl-sdfile
      - chemical/x-mdl-molfile
      - chemical/x-mol2
      - chemical/x-pdb
      - application/octet-stream
    recommended_name: ligand.sdf
  - role: structure_2d_sdf
    required: false
    allowed_formats: [sdf]
    content_types: [chemical/x-mdl-sdfile, application/octet-stream]
    recommended_name: ligand.2d.sdf
  - role: structure_3d_sdf
    required: false
    allowed_formats: [sdf]
    content_types: [chemical/x-mdl-sdfile, application/octet-stream]
    recommended_name: ligand.3d.sdf
  - role: metadata_json
    required: false
    allowed_formats: [json]
    content_types: [application/json]
    recommended_name: metadata.json
metadata_schema:
  type: object
  required:
    - ligand_id
  properties:
    ligand_id:
      type: string
    source_database:
      type: string
      enum: [pubchem, manual, tool_output]
    source_id:
      type: string
    pubchem_cid:
      type: string
    canonical_smiles:
      type: string
    isomeric_smiles:
      type: string
    iupac_name:
      type: string
    molecular_formula:
      type: string
    molecular_weight:
      type: string
    structure_3d_source:
      type: string
      enum: [pubchem_3d, rdkit_generated_3d, 2d_only]
    hydrogens_added:
      type: boolean
    stereochemistry_undefined:
      type: boolean
    fetched_at:
      type: string
      format: date-time
    source_url:
      type: string
validators:
  - ligand_structure_v1_core
