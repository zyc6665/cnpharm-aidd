type: protein_structure
version: 1
file_roles:
  - role: structure_file
    required: true
    primary: true
    allowed_formats: [pdb]
    content_types: [chemical/x-pdb, application/octet-stream]
    recommended_name: structure.pdb
  - role: metadata_json
    required: true
    allowed_formats: [json]
    content_types: [application/json]
    recommended_name: metadata.json
metadata_schema:
  type: object
  required:
    - chain_ids
    - residue_count
    - atom_count
    - structure_format
    - source_filename
  properties:
    chain_ids:
      type: array
      items:
        type: string
    residue_count:
      type: integer
    atom_count:
      type: integer
    structure_format:
      type: string
      enum: [pdb, cif]
    source_filename:
      type: string
    source_database:
      type: string
      enum: [rcsb, manual, tool_output]
    source_id:
      type: string
    fetched_at:
      type: string
      format: date-time
    source_url:
      type: string
validators:
  - protein_structure_v1_core
